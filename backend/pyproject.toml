[project]
name = "porch"
version = "0.1.0"
description = "Porch Ledger backend: Ring doorbell events into visits"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "mcp>=2,<3",
    "pillow>=12.3.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "rapidfuzz>=3.14.6",
    "strands-agents~=1.59",
    "truststore==0.10.4",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/porch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PIE", "RET", "TRY", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[dependency-groups]
dev = [
    "boto3>=1.43.111",
    "httpx>=0.28.1",
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "types-boto3[bedrock-runtime,dynamodb,polly,rekognition,s3,ssm,textract]>=1.43.111",
]
