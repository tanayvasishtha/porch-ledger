name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run scripts/check_prose.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest --cov=porch.domain --cov=porch.adapters --cov=porch.api --cov-report=term-missing --cov-fail-under=90
      - run: uv run python -m porch export-contracts --out ../contracts && git -C .. diff --exit-code contracts

  tv:
    # Screenshot goldens are recorded on Windows; font rasterisation differs on Linux.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tv
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: spotless
        run: ./gradlew.bat spotlessCheck
      - name: detekt
        run: ./gradlew.bat detekt
      - name: lint
        run: ./gradlew.bat lint
      - name: unit tests
        run: ./gradlew.bat testDebugUnitTest
      - name: screenshot tests
        run: ./gradlew.bat verifyRoborazziDebug
      - name: release build
        run: ./gradlew.bat assembleRelease

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
